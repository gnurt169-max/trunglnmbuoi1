<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#9333ea" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg6)"/>
  <ellipse cx="200" cy="340" rx="80" ry="14" fill="#e9d5ff" opacity="0.6"/>

  <!-- Straps -->
  <rect x="165" y="40" width="70" height="90" rx="10" fill="url(#strapGrad)"/>
  <rect x="165" y="270" width="70" height="90" rx="10" fill="url(#strapGrad)"/>

  <!-- Smartwatch Case -->
  <g filter="url(#shadow6)">
    <!-- Case frame -->
    <rect x="135" y="115" width="130" height="170" rx="36" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    
    <!-- Crown button -->
    <rect x="265" y="155" width="8" height="30" rx="4" fill="#94a3b8"/>
    
    <!-- AMOLED Screen -->
    <rect x="145" y="125" width="110" height="150" rx="28" fill="#000000"/>

    <!-- Screen Elements -->
    <text x="200" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="bold" fill="#38bdf8" text-anchor="middle">10:42</text>
    <text x="200" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">MON, 16 NOV</text>
    
    <!-- Activity ring / Heart rate -->
    <circle cx="178" cy="245" r="14" stroke="#e2e8f0" stroke-width="3" fill="none" opacity="0.2"/>
    <circle cx="178" cy="245" r="14" stroke="#ef4444" stroke-width="3" stroke-dasharray="60 30" fill="none"/>
    <text x="178" y="249" font-family="sans-serif" font-size="11" fill="#ef4444" text-anchor="middle">♥</text>

    <!-- Battery & Steps -->
    <text x="220" y="248" font-family="sans-serif" font-size="12" font-weight="bold" fill="#22c55e" text-anchor="middle">85%</text>
  </g>
</svg>
