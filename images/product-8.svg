<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow8" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="16" stdDeviation="14" flood-color="#f43f5e" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg8)"/>
  <ellipse cx="200" cy="335" rx="100" ry="14" fill="#fecdd3" opacity="0.6"/>

  <!-- Stylus Pen angled -->
  <g transform="translate(190, 200) rotate(-42)" filter="url(#shadow8)">
    <!-- Pen nib -->
    <polygon points="0,-160 -5,-135 5,-135" fill="#0f172a"/>
    <polygon points="0,-165 -2,-160 2,-160" fill="#94a3b8"/>

    <!-- Pen Body -->
    <rect x="-6" y="-135" width="12" height="270" rx="3" fill="url(#penGrad)" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Flat magnetic edge highlight -->
    <rect x="-2" y="-110" width="4" height="220" fill="#f1f5f9"/>

    <!-- Top Cap / Charging Ring -->
    <rect x="-6" y="130" width="12" height="8" fill="#e11d48"/>
    <rect x="-5" y="138" width="10" height="4" rx="2" fill="#94a3b8"/>
  </g>
</svg>
