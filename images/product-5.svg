<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="spkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg5)"/>
  <ellipse cx="200" cy="335" rx="100" ry="16" fill="#a5f3fc" opacity="0.6"/>

  <!-- Bluetooth Speaker -->
  <g filter="url(#shadow5)">
    <!-- Cylinder body -->
    <rect x="135" y="110" width="130" height="190" rx="40" fill="url(#spkGrad)"/>
    <!-- Top disc -->
    <ellipse cx="200" cy="115" rx="60" ry="20" fill="#0c4a6e"/>
    <ellipse cx="200" cy="115" rx="45" ry="14" fill="#0369a1"/>
    <!-- Power button on top -->
    <circle cx="200" cy="115" r="7" fill="#38bdf8"/>

    <!-- Speaker mesh texture -->
    <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="2">
      <line x1="145" y1="150" x2="255" y2="150"/>
      <line x1="140" y1="170" x2="260" y2="170"/>
      <line x1="138" y1="190" x2="262" y2="190"/>
      <line x1="138" y1="210" x2="262" y2="210"/>
      <line x1="140" y1="230" x2="260" y2="230"/>
      <line x1="145" y1="250" x2="255" y2="250"/>
      <line x1="155" y1="270" x2="245" y2="270"/>
    </g>

    <!-- Volume + / - icons -->
    <text x="200" y="195" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.9">+</text>
    <text x="200" y="240" font-family="sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.9">-</text>
  </g>
</svg>
